    <script>
      // Build-based cache bust + service worker cleanup
      (function(){
        var APP_VERSION = '__APP_BUILD_ID__';
        var VERSION_KEY = 'app_build_id';
        var SYNC_KEY = 'app_build_sync';
        var stored = localStorage.getItem(VERSION_KEY);

        if (stored && stored !== APP_VERSION) {
          if (sessionStorage.getItem(SYNC_KEY) === APP_VERSION) return;
          sessionStorage.setItem(SYNC_KEY, APP_VERSION);
          localStorage.setItem(VERSION_KEY, APP_VERSION);

          var clearCaches = ('caches' in window)
            ? caches.keys().then(function(keys){
                var deletions = [];
                for (var i = 0; i < keys.length; i++) deletions.push(caches.delete(keys[i]));
                return Promise.all(deletions);
              })
            : Promise.resolve();

          var clearServiceWorkers = ('serviceWorker' in navigator)
            ? navigator.serviceWorker.getRegistrations().then(function(regs){
                var unregs = [];
                for (var k = 0; k < regs.length; k++) unregs.push(regs[k].unregister());
                return Promise.all(unregs);
              })
            : Promise.resolve();

          Promise.all([clearCaches, clearServiceWorkers]).finally(function(){
            location.reload();
          });
          return;
        }

        if (!stored) {
          localStorage.setItem(VERSION_KEY, APP_VERSION);
        }
        sessionStorage.removeItem(SYNC_KEY);
      })();

      // Pre-React subdomain branding
      (function(){
        var host = location.hostname;
        var base = 'ourschooltech.com';
        if (host === 'localhost' || /^\d+\.\d+\.\d+\.\d+$/.test(host)) return;
        if (!host.endsWith('.' + base)) return;
        var sub = host.replace('.' + base, '');
        if (!sub || ['www','app','admin'].indexOf(sub) >= 0) return;

        function applyBrand(t) {
          if (t.title) document.title = t.title;
          if (t.logo) {
            var fav = document.querySelector('link[rel="icon"]');
            if (fav) fav.href = t.logo;
            var apple = document.querySelector('link[rel="apple-touch-icon"]');
            if (apple) apple.href = t.logo;
            var pl = document.createElement('link');
            pl.rel = 'preload'; pl.as = 'image'; pl.href = t.logo;
            pl.setAttribute('fetchpriority','high');
            document.head.appendChild(pl);
            var slot = document.getElementById('pre-react-logo');
            if (slot && !slot.firstChild) {
              var im = new Image();
              im.src = t.logo; im.alt = '';
              im.style.cssText = 'width:96px;height:96px;object-fit:contain;display:block';
              im.setAttribute('fetchpriority','high');
              im.decoding = 'sync';
              slot.appendChild(im);
            }
          }
          if (t.color) {
            var mc = document.querySelector('meta[name="theme-color"]');
            if (mc) mc.setAttribute('content', t.color);
            var loader = document.getElementById('pre-react-loader');
            if (loader) loader.style.background = t.color + '10';
          }
        }

        var cached = localStorage.getItem('tenant_' + sub) || sessionStorage.getItem('tenant_' + sub);
        if (cached) {
          try { applyBrand(JSON.parse(cached)); } catch(e) {}
        }

        var url = 'https://oxqkmugovmqcuosimbzz.supabase.co/rest/v1/rpc/get_school_by_code';
        var key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94cWttdWdvdm1xY3Vvc2ltYnp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyMDY0MjUsImV4cCI6MjA4NTc4MjQyNX0.HXIEeDbbO4pgZYGqe7gJjSrVfUdgwHwaJJ2M9uDkVRo';
        fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': key, 'Authorization': 'Bearer ' + key },
          body: JSON.stringify({ _code: sub })
        })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if (!d) return;
          var brand = { title: d.app_display_name || d.name, logo: d.logo, color: d.primary_color };
          applyBrand(brand);
          var s = JSON.stringify(brand);
          sessionStorage.setItem('tenant_' + sub, s);
          try { localStorage.setItem('tenant_' + sub, s); } catch(e) {}
        })
        .catch(function(){});
      })();
    </script>
